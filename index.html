<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Isolated</title>
    <style>
        body { background: #0d0d1a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 10px; margin: 0; overflow-x: hidden; }
        .btn-mode { background: #222244; color: white; border: 2px solid #555599; padding: 6px 12px; cursor: pointer; font-weight: bold; border-radius: 4px; margin: 5px; }
        .btn-mode.active { background: #ffaa00; color: black; border-color: #ffcc00; }
        
        /* STABILES MAP-CONTAINER-DESIGN GEGEN VERRUTSCHEN */
        .board-wrapper { width: 440px; margin: 15px auto; background: #151525; padding: 15px; border-radius: 8px; border: 2px solid #333355; box-sizing: border-box; }
        .board-row { display: flex; justify-content: center; margin-bottom: 2px; }
        .cell { width: 40px; height: 40px; background: #222; border: 1px solid #444; border-radius: 4px; margin-right: 2px; box-sizing: border-box; }
        
        .cell.void { visibility: hidden; }
        .cell.free { background: #2a2a44; border: 1px solid #555577; }
        .online-panel { max-width: 440px; margin: 12px auto; padding: 12px; background: #1a1a35; border-radius: 8px; }
        .online-panel input { width: 110px; padding: 8px; border: 1px solid #555599; border-radius: 4px; background: #111125; color: white; text-align: center; font-weight: bold; text-transform: uppercase; }
        #room-status { min-height: 1.4em; margin: 8px 0 0; color: #ddd; }
        #room-code-display { color: #ffaa00; font-size: 22px; font-weight: bold; letter-spacing: 3px; }
        .victory-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 15, 0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; }
        .victory-box { padding: 40px; border-radius: 15px; background: #111125; border: 4px solid #ffaa00; }
        .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: fall 3s linear infinite; top: -10px; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</head>
<body>
    <h1>🎮 ISOLATED </h1>
    <div style="background: #1a1a35; padding: 5px; border-radius: 8px; display: inline-block;">
        <button id="mode-1" class="btn-mode active" onclick="setMode(1)">1 Match</button>
        <button id="mode-3" class="btn-mode" onclick="setMode(3)">Best of 3</button>
        <button id="mode-5" class="btn-mode" onclick="setMode(5)">Best of 5</button>
    </div>
    <div class="online-panel">
        <strong>Online spielen</strong><br>
        <button id="create-room" class="btn-mode" onclick="createRoom()">Raum erstellen</button>
        <input id="room-code-input" maxlength="6" placeholder="RAUMCODE" aria-label="Raumcode">
        <button id="join-room" class="btn-mode" onclick="joinRoom()">Beitreten</button>
        <div id="room-code-display"></div>
        <div id="room-status" role="status">Oder lokal zu zweit an einer Tastatur spielen.</div>
    </div>
    <div style="font-size: 24px; font-weight: bold; margin: 10px 0;"><span style="color: #00ffff;">BLAU: <span id="score-p1">0</span></span> ⚔️ <span style="color: #ff6347;">ROT: <span id="score-p2">0</span></span></div>
    <div id="map-name" style="font-size: 22px; color: #ffaa00; font-weight: bold;">Map...</div>
    <div id="turn-info" style="font-size: 18px; margin: 10px 0; font-weight: bold;">Am Zug: BLAU</div>
    
    <!-- Stabiler Wrapper für feste Zeilen -->
    <div class="board-wrapper" id="board"></div>
    
    <button id="next-round" class="btn-mode" style="background:#00ffff; color:black; padding:10px 20px;" onclick="nextRound()">Nächste Runde 🎲</button>

    <div id="victoryOverlay" class="victory-screen">
        <div class="victory-box">
            <span style="font-size:80px;">🏆</span>
            <div id="victoryPlayerText" style="font-size:36px; font-weight:bold; margin:20px 0;">Sieg!</div>
            <button id="restart-tournament" class="btn-mode" style="background:#ffaa00; color:black; padding:12px 24px;" onclick="closeVictory()">Turnier Neustarten 🔄</button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://qugjkvztipvrmfqugily.supabase.co';
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_mTMgcyOv4MdvINKmIBa88Q_R6_AmAyH';
    const supabaseClient = window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_PUBLIC_KEY.startsWith('YOUR_')
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY)
        : null;
    const playerId = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2);
    const roomAlphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let roomChannel = null, roomCode = '', localPlayer = 0, roomReady = false, guestPlayerId = '';
    let winnerName = '', statusText = '';
    const size = 10; let grid = [], p1 = {}, p2 = {}, turn = 1, gameOver = false, tournamentOver = false, maxRounds = 1, winsP1 = 0, winsP2 = 0, mapIdx = 0, autoTimer = null, p1First = true;
    for (let x = 0; x < size; x++) grid[x] = [];

    function setMode(m) {
        if (onlineGuest()) return;
        if(autoTimer) clearTimeout(autoTimer);
        maxRounds = m;
        document.getElementById('mode-1').className = m==1?'btn-mode active':'btn-mode';
        document.getElementById('mode-3').className = m==3?'btn-mode active':'btn-mode';
        document.getElementById('mode-5').className = m==5?'btn-mode active':'btn-mode';
        winsP1 = winsP2 = 0; tournamentOver = false; winnerName = '';
        document.getElementById('victoryOverlay').style.display = 'none';
        document.querySelectorAll('.confetti').forEach(c => c.remove());
        document.getElementById('score-p1').innerText = document.getElementById('score-p2').innerText = 0;
        initGame();
        updateOnlineControls();
        if (roomReady && onlineHost()) broadcastState();
    }

    function nextRound() {
        if (onlineGuest()) {
            sendRoomEvent('next-round', { playerId }).catch(showRoomError);
            return;
        }
        if (onlineHost() && !roomReady) return;
        if(autoTimer) clearTimeout(autoTimer);
        if (tournamentOver) setMode(maxRounds);
        else {
            initGame();
            updateOnlineControls();
        }
        if (onlineHost()) broadcastState();
    }

    function onlineGuest() { return roomReady && localPlayer === 2; }
    function onlineHost() { return localPlayer === 1; }
    function setRoomStatus(message) { document.getElementById('room-status').innerText = message; }
    function showRoomError(error) {
        console.error('Online-Spiel Fehler:', error);
        setRoomStatus('Verbindungsfehler: ' + (error && error.message ? error.message : 'Bitte Verbindung und Supabase-Konfiguration prüfen.'));
    }

    function updateOnlineControls() {
        const guest = onlineGuest();
        document.getElementById('create-room').disabled = !!roomChannel;
        document.getElementById('join-room').disabled = !!roomChannel;
        document.getElementById('room-code-input').disabled = !!roomChannel;
        document.getElementById('next-round').disabled = guest
            ? !gameOver && !tournamentOver
            : onlineHost() && (!roomReady || (!gameOver && !tournamentOver));
        document.getElementById('restart-tournament').disabled = guest;
        ['mode-1', 'mode-3', 'mode-5'].forEach(id => {
            document.getElementById(id).disabled = guest;
        });
    }

    function randomRoomCode() {
        const values = new Uint8Array(6);
        crypto.getRandomValues(values);
        return Array.from(values, value => roomAlphabet[value % roomAlphabet.length]).join('');
    }

    async function sendRoomEvent(event, payload) {
        if (!roomChannel) throw new Error('Es besteht keine Raumverbindung.');
        const result = await roomChannel.send({ type: 'broadcast', event, payload });
        if (result.status !== 'ok') throw new Error('Supabase hat die Nachricht nicht gesendet (' + result.status + ').');
    }

    function attachRoomHandlers(channel) {
        channel.on('broadcast', { event: 'join' }, ({ payload }) => {
            if (!onlineHost() || !payload || typeof payload.playerId !== 'string') return;
            if (guestPlayerId && guestPlayerId !== payload.playerId) {
                sendRoomEvent('room-full', { target: payload.playerId }).catch(showRoomError);
                return;
            }
            guestPlayerId = payload.playerId;
            roomReady = true;
            setRoomStatus('Spieler verbunden! Du spielst BLAU.');
            updateOnlineControls();
            sendRoomEvent('welcome', { target: guestPlayerId, hostPlayerId: playerId }).then(broadcastState).catch(showRoomError);
        });
        channel.on('broadcast', { event: 'welcome' }, ({ payload }) => {
            if (!payload || payload.target !== playerId || onlineHost()) return;
            roomHostId = payload.hostPlayerId;
            localPlayer = 2;
            roomReady = true;
            setRoomStatus('Verbunden! Du spielst ROT. Warte auf den Zug von BLAU.');
            updateOnlineControls();
        });
        channel.on('broadcast', { event: 'room-full' }, ({ payload }) => {
            if (payload && payload.target === playerId) {
                setRoomStatus('Dieser Raum ist bereits voll. Bitte verwende einen anderen Raumcode.');
                leaveRoom(false);
            }
        });
        channel.on('broadcast', { event: 'state' }, ({ payload }) => {
            if (onlineGuest() && payload && payload.playerId === roomHostId) applyState(payload.state);
        });
        channel.on('broadcast', { event: 'move' }, ({ payload }) => {
            if (onlineHost() && roomReady && payload && payload.playerId === guestPlayerId && turn === 2) {
                applyMove(payload.dx, payload.dy);
            }
        });
        channel.on('broadcast', { event: 'next-round' }, ({ payload }) => {
            if (onlineHost() && roomReady && (gameOver || tournamentOver) && payload && payload.playerId === guestPlayerId) {
                nextRound();
            }
        });
    }

    let roomHostId = '';
    async function connectToRoom(code, isHost) {
        if (!supabaseClient) {
            throw new Error('Online-Modus ist noch nicht eingerichtet. Trage SUPABASE_URL und SUPABASE_PUBLIC_KEY im index.html ein.');
        }
        roomCode = code;
        roomHostId = isHost ? playerId : '';
        localPlayer = isHost ? 1 : 0;
        roomReady = false;
        guestPlayerId = '';
        roomChannel = supabaseClient.channel('isolated-' + code, {
            config: { private: false, broadcast: { self: false } }
        });
        attachRoomHandlers(roomChannel);
        updateOnlineControls();
        await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Supabase-Verbindung dauerte zu lange.')), 12000);
            roomChannel.subscribe(status => {
                if (status === 'SUBSCRIBED') {
                    clearTimeout(timeout);
                    resolve();
                } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
                    clearTimeout(timeout);
                    reject(new Error('Supabase-Kanalstatus: ' + status));
                }
            });
        });
        if (isHost) {
            document.getElementById('room-code-display').innerText = 'Raumcode: ' + code;
            setRoomStatus('Warte auf den zweiten Spieler ...');
        } else {
            setRoomStatus('Verbinde mit Raum ' + code + ' ...');
            await sendRoomEvent('join', { playerId });
            setTimeout(() => {
                if (roomChannel && !roomReady) setRoomStatus('Noch keine Antwort vom Raum. Prüfe den Code und ob der Host verbunden ist.');
            }, 12000);
        }
        updateOnlineControls();
    }

    async function createRoom() {
        try {
            setMode(maxRounds);
            await connectToRoom(randomRoomCode(), true);
        } catch (error) {
            showRoomError(error);
            leaveRoom(false);
        }
    }

    async function joinRoom() {
        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
        if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
            setRoomStatus('Bitte einen gültigen 6-stelligen Raumcode eingeben.');
            return;
        }
        try {
            await connectToRoom(code, false);
        } catch (error) {
            showRoomError(error);
            leaveRoom(false);
        }
    }

    function leaveRoom(showMessage = true) {
        if (roomChannel) supabaseClient.removeChannel(roomChannel).catch(showRoomError);
        roomChannel = null; roomCode = ''; roomHostId = ''; guestPlayerId = '';
        roomReady = false; localPlayer = 0;
        document.getElementById('room-code-display').innerText = '';
        if (showMessage) setRoomStatus('Verbindung getrennt. Lokal zu zweit spielen ist weiterhin möglich.');
        updateOnlineControls();
    }

    function createSnapshot() {
        return {
            grid, p1, p2, turn, gameOver, tournamentOver, maxRounds, winsP1, winsP2,
            mapIdx, p1First, winnerName, statusText
        };
    }

    async function broadcastState() {
        if (roomChannel && onlineHost() && roomReady) {
            await sendRoomEvent('state', { playerId, state: createSnapshot() });
        }
    }

    function applyState(state) {
        if (!state || !Array.isArray(state.grid) || state.grid.length !== size) return;
        grid = state.grid;
        p1 = state.p1; p2 = state.p2; turn = state.turn;
        gameOver = state.gameOver; tournamentOver = state.tournamentOver;
        maxRounds = state.maxRounds; winsP1 = state.winsP1; winsP2 = state.winsP2;
        mapIdx = state.mapIdx; p1First = state.p1First;
        winnerName = state.winnerName || ''; statusText = state.statusText || '';
        document.getElementById('score-p1').innerText = winsP1;
        document.getElementById('score-p2').innerText = winsP2;
        document.getElementById('map-name').innerText = ['🦋 Der Schmetterling', '📦 Das Logistik-Zentrum', '🏛️ Die Arena der Titanen'][mapIdx];
        document.getElementById('turn-info').innerHTML = statusText || 'Am Zug: ' + (turn === 1 ? 'BLAU' : 'ROT');
        drawBoard();
        updateOnlineControls();
        if (tournamentOver && document.getElementById('victoryOverlay').style.display !== 'flex') {
            triggerVictory(winnerName, winnerName === 'Blau' ? '#00ffff' : '#ff6347');
        }
    }

    function initGame() {
        if (onlineGuest()) return;
        gameOver = false; turn = 1; mapIdx = Math.floor(Math.random() * 3); p1First = true;
        winnerName = ''; statusText = 'Am Zug: <span style="color: #00ffff;">BLAU (WASD)</span>';
        document.getElementById('turn-info').style.color = 'white'; document.getElementById('turn-info').innerHTML = statusText;
        
        if (mapIdx == 0) { document.getElementById('map-name').innerText = "🦋 Der Schmetterling"; p1 = {x:1, y:1}; p2 = {x:8, y:1}; }
        else if (mapIdx == 1) { document.getElementById('map-name').innerText = "📦 Das Logistik-Zentrum"; p1 = {x:1, y:2}; p2 = {x:8, y:2}; }
        else { document.getElementById('map-name').innerText = "🏛️ Die Arena der Titanen"; p1 = {x:2, y:4}; p2 = {x:7, y:4}; }
        
        for(let y=0; y<size; y++) {
            for(let x=0; x<size; x++) {
                let f = false;

                if (mapIdx == 0) { // Schmetterling original
                    if ((x == 1 || x == 2 || x == 7 || x == 8) && y >= 1 && y <= 6 && y != 4) f = true;
                    if ((x == 3 || x == 6) && y >= 2 && y <= 6) f = true;
                    if ((x == 4 || x == 5) && y >= 3 && y <= 5) f = true;
                } else if (mapIdx == 1) { // Logistik-Zentrum original
                    if ((y == 2 || y == 6) && x >= 1 && x <= 8) f = true;
                    if ((x == 1 || x == 3 || x == 6 || x == 8) && y >= 3 && y <= 5) f = true;
                    if (y == 4 && x >= 3 && x <= 6) f = true;
                } else { // Arena der Titanen original
                    if (x >= 2 && x <= 7 && y >= 2 && y <= 7) f = true;
                    if ((y == 4 || y == 5) && (x == 4 || x == 5)) f = false;
                    if ((x == 1 || x == 8) && y >= 3 && y <= 5) f = true;
                }

                grid[x][y] = f ? 'free' : 'void';
            }
        }
        grid[p1.x][p1.y] = 'p1'; grid[p2.x][p2.y] = 'p2'; drawBoard();
    }
    
    // Generiert jetzt feste Zeilenreihen, damit das Layout absolut stabil bleibt
    function drawBoard() {
        const b = document.getElementById('board'); b.innerHTML = '';
        for(let y=0; y<size; y++) {
            const row = document.createElement('div');
            row.className = 'board-row';
            for(let x=0; x<size; x++) {
                const c = document.createElement('div'); const s = grid[x][y];
                c.className = s == 'void' ? 'cell void' : 'cell free';
                if(s == 'p1') c.style.backgroundColor = '#00ffff';
                if(s == 'p2') c.style.backgroundColor = '#ff6347';
                if(s == 'destroyed') c.style.backgroundColor = '#111';
                row.appendChild(c);
            }
            b.appendChild(row);
        }
    }
    
    window.addEventListener('keydown', (e) => {
        if(gameOver || tournamentOver) return; let k = e.key.toLowerCase();
        if (roomChannel && (!roomReady || localPlayer !== turn)) return;
        if(turn == 1) { if(k=='w') move(0,-1); if(k=='s') move(0,1); if(k=='a') move(-1,0); if(k=='d') move(1,0); }
        else { if(e.key=='ArrowUp') move(0,-1); if(e.key=='ArrowDown') move(0,1); if(e.key=='ArrowLeft') move(-1,0); if(e.key=='ArrowRight') move(1,0); }
    });
    
    function move(dx, dy) {
        if (roomChannel && (!roomReady || localPlayer !== turn)) return;
        if (roomChannel && onlineGuest()) {
            sendRoomEvent('move', { playerId, dx, dy }).catch(showRoomError);
            return;
        }
        applyMove(dx, dy);
    }

    function applyMove(dx, dy) {
        let p = turn == 1 ? p1 : p2; let nx = p.x + dx, ny = p.y + dy;
        if(nx>=0 && nx<size && ny>=0 && ny<size && grid[nx][ny] == 'free') {
            grid[p.x][p.y] = (turn == 1 && p1First) ? 'free' : 'destroyed';
            if(turn == 1) p1First = false;
            p.x = nx; p.y = ny; grid[p.x][p.y] = turn == 1 ? 'p1' : 'p2';
            turn = turn == 1 ? 2 : 1;
            statusText = "Am Zug: <span style='color:" + (turn==1?'#00ffff':'#ff6347') + ";'>" + (turn==1?'BLAU':'ROT') + "</span>";
            document.getElementById('turn-info').innerHTML = statusText;
            drawBoard(); checkWin();
            updateOnlineControls();
            if (onlineHost()) broadcastState().catch(showRoomError);
        }
    }
    
    function checkWin() {
        let p = turn == 1 ? p1 : p2, w = false, dx = [0,0,-1,1], dy = [-1,1,0,0];
        for(let i=0; i<4; i++) {
            let tx = p.x+dx[i], ty = p.y+dy[i];
            if(tx>=0 && tx<size && ty>=0 && ty<size && grid[tx][ty] == 'free') w = true;
        }
        if(!w) {
            gameOver = true; let rW = turn == 1 ? 2 : 1, t = "";
            if (rW == 1) { winsP1++; document.getElementById('score-p1').innerText = winsP1; t = '🎉 BLAU GEWINNT!'; }
            else { winsP2++; document.getElementById('score-p2').innerText = winsP2; t = '🎉 ROT GEWINNT!'; }
            let nW = maxRounds == 1 ? 1 : Math.ceil(maxRounds / 2);
            if (winsP1 >= nW) { winnerName = 'Blau'; triggerVictory("Blau", "#00ffff"); }
            else if (winsP2 >= nW) { winnerName = 'Rot'; triggerVictory("Rot", "#ff6347"); }
            else if (roomChannel) {
                statusText = t + "<br><span style='color:#ffaa00; font-size:14px;'>Host startet die nächste Runde.</span>";
                document.getElementById('turn-info').innerHTML = statusText;
            } else startTimer(t, 3);
        }
    }

    function startTimer(t, s) {
        if (s > 0) {
            document.getElementById('turn-info').innerHTML = t + "<br><span style='color:#ffaa00; font-size:14px;'>Nächste Runde in " + s + "s...</span>";
            autoTimer = setTimeout(() => startTimer(t, s - 1), 1000);
        } else { initGame(); }
    }
    
    function triggerVictory(p, c) {
        tournamentOver = true; winnerName = p; const o = document.getElementById('victoryOverlay'); const t = document.getElementById('victoryPlayerText');
        t.innerText = "🏆 " + p + " gewinnt das Turnier! 🏆"; t.style.color = c; o.style.display = 'flex';
        for(let i=0; i<50; i++) {
            let f = document.createElement('div'); f.className = 'confetti'; f.style.left = Math.random() * 100 + 'vw'; f.style.animationDelay = Math.random() * 2 + 's';
            f.style.backgroundColor = ['#00ffff','#ff5555','#ffaa00','#00ff00'][Math.floor(Math.random()*4)]; o.appendChild(f);
        }
    }
    function closeVictory() { if (onlineGuest()) return; document.getElementById('victoryOverlay').style.display = 'none'; document.querySelectorAll('.confetti').forEach(c => c.remove()); setMode(maxRounds); }
    initGame();
    updateOnlineControls();
</script>
</body>
</html>
